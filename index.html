
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17241d">
  <title>Mi catálogo digital</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #17241d;
    }

    #book {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      --fb-bg: transparent;
      --fb-control-bg: rgba(15, 24, 19, .85);
      --fb-control-fg: #f3efe5;
      --fb-counter-fg: #cfc9b8;
    }
  </style>
</head>

<body>
  <div id="book"></div>

  <script src="./pdflipbook.js"></script>
  <script>
    const bookElement = document.getElementById('book');

    PDFlipbook.create(bookElement, {
      url: './catalogo.pdf',
      displayMode: 'auto'
    });
  </script>
</body>
</html>
